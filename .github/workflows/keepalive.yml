name: Safe Keep-Alive (Zero-API Traffic Ping)

on:
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Low-Profile HTTP Keep-Alive (No Unikraft API Polling)
        env:
          ARGO_DOMAIN_A_SIN: ${{ secrets.ARGO_DOMAIN_A_SIN }}
          ARGO_DOMAIN_A_SFO: ${{ secrets.ARGO_DOMAIN_A_SFO }}
          ARGO_DOMAIN_B_SIN: ${{ secrets.ARGO_DOMAIN_B_SIN }}
          ARGO_DOMAIN_B_FRA: ${{ secrets.ARGO_DOMAIN_B_FRA }}
          ARGO_DOMAIN_C_WAS: ${{ secrets.ARGO_DOMAIN_C_WAS }}
          ARGO_DOMAIN_C_DAL: ${{ secrets.ARGO_DOMAIN_C_DAL }}
        run: |
          for d in "$ARGO_DOMAIN_A_SIN" "$ARGO_DOMAIN_A_SFO" "$ARGO_DOMAIN_B_SIN" "$ARGO_DOMAIN_B_FRA" "$ARGO_DOMAIN_C_WAS" "$ARGO_DOMAIN_C_DAL"; do
            if [[ -z "$d" ]]; then continue; fi
            echo -n "Pinging https://$d -> "
            curl -s -m 5 -o /dev/null -w "HTTP %{http_code} (%{time_total}s)\n" "https://$d" || echo "FAIL"
          done
