<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unikraft Ultra · 极光节点控制中心</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  <style>
    :root {
      --bg-deep: #070913;
      --card-bg: rgba(17, 24, 39, 0.68);
      --card-hover: rgba(30, 41, 59, 0.78);
      --border: rgba(255, 255, 255, 0.1);
      --border-glow: rgba(99, 102, 241, 0.45);
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --cyan: #06b6d4;
      --emerald: #10b981;
      --amber: #f59e0b;
      --rose: #f43f5e;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
      background-color: var(--bg-deep);
      background-image:
        radial-gradient(at 12% 15%, rgba(99, 102, 241, 0.22) 0px, transparent 48%),
        radial-gradient(at 88% 12%, rgba(6, 182, 212, 0.18) 0px, transparent 45%),
        radial-gradient(at 50% 90%, rgba(16, 185, 129, 0.12) 0px, transparent 50%);
      color: var(--text);
      line-height: 1.55;
      overflow-x: hidden;
    }

    main {
      max-width: 1080px;
      margin: 0 auto;
      padding: 2.5rem 1.25rem 4rem;
    }

    /* 顶部标题区 */
    .hero {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.8rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.9rem;
    }

    .brand-logo {
      width: 46px;
      height: 46px;
      border-radius: 13px;
      background: linear-gradient(135deg, var(--primary), var(--cyan));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.45rem;
      box-shadow: 0 8px 24px rgba(99, 102, 241, 0.35);
    }

    .brand h1 {
      margin: 0;
      font-size: 1.65rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(90deg, #fff, #cbd5e1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand p {
      margin: 0.15rem 0 0;
      color: var(--muted);
      font-size: 0.88rem;
    }

    .hero-badges {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .pill {
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      color: #cbd5e1;
    }

    /* 毛玻璃卡片 */
    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 1.4rem 1.5rem;
      margin-bottom: 1.25rem;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
      transition: border-color 0.25s ease;
    }

    .glass-card:hover {
      border-color: rgba(255, 255, 255, 0.18);
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1.1fr 1.4fr;
      gap: 1.1rem;
    }

    @media (max-width: 780px) {
      .form-grid { grid-template-columns: 1fr; }
    }

    label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 650;
      font-size: 0.9rem;
      margin-bottom: 0.45rem;
      color: #e2e8f0;
    }

    input[type="password"], input[type="text"], textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: rgba(15, 23, 42, 0.75);
      color: var(--text);
      padding: 0.75rem 0.9rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.86rem;
      transition: all 0.2s ease;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.22);
    }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .eye-btn {
      position: absolute;
      right: 8px;
      background: transparent;
      border: none;
      color: var(--muted);
      cursor: pointer;
      padding: 0.3rem 0.5rem;
      font-size: 0.8rem;
    }

    .remember-row {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      margin-top: 0.55rem;
      font-size: 0.82rem;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.65rem;
      margin-top: 1.1rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      border: 1px solid transparent;
      border-radius: 11px;
      font-size: 0.88rem;
      font-weight: 650;
      padding: 0.62rem 1.05rem;
      cursor: pointer;
      transition: all 0.2s ease;
      color: #fff;
      background: linear-gradient(135deg, var(--primary), var(--primary-hover));
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.3);
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.45);
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .btn-ghost {
      background: rgba(255, 255, 255, 0.06);
      border-color: var(--border);
      color: #e2e8f0;
      box-shadow: none;
    }

    .btn-ghost:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.25);
      box-shadow: none;
    }

    .btn-emerald {
      background: linear-gradient(135deg, #10b981, #059669);
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.28);
    }

    .btn-cyan {
      background: linear-gradient(135deg, #06b6d4, #0284c7);
      box-shadow: 0 4px 14px rgba(6, 182, 212, 0.28);
    }

    .status-banner {
      display: none;
      margin-bottom: 1.2rem;
      padding: 0.8rem 1.1rem;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .status-banner.show { display: flex; align-items: center; justify-content: space-between; }
    .status-banner.ok { background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.4); color: #6ee7b7; }
    .status-banner.err { background: rgba(244, 63, 94, 0.15); border: 1px solid rgba(244, 63, 94, 0.4); color: #fda4af; }

    /* 统计与筛选栏 */
    .dashboard-section { display: none; }
    .dashboard-section.active { display: block; }

    .stats-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 0.85rem;
      margin-bottom: 1.2rem;
    }

    .stat-box {
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 0.9rem 1.1rem;
    }

    .stat-box .num {
      font-size: 1.5rem;
      font-weight: 800;
      color: #fff;
    }

    .stat-box .lbl {
      font-size: 0.78rem;
      color: var(--muted);
    }

    .filter-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      margin-bottom: 1.1rem;
    }

    .tab-btn {
      padding: 0.4rem 0.85rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.04);
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .tab-btn.active, .tab-btn:hover {
      background: rgba(99, 102, 241, 0.22);
      border-color: var(--primary);
      color: #fff;
    }

    /* 节点卡片网格 */
    .nodes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 0.95rem;
      margin-bottom: 1.5rem;
    }

    .node-card {
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid var(--border);
      border-radius: 15px;
      padding: 1rem 1.1rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 0.8rem;
      transition: all 0.2s ease;
    }

    .node-card:hover {
      transform: translateY(-2px);
      border-color: var(--border-glow);
      background: var(--card-hover);
    }

    .node-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .node-title {
      font-weight: 700;
      font-size: 0.98rem;
      display: flex;
      align-items: center;
      gap: 0.45rem;
      word-break: break-all;
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
    }

    .tag {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 0.16rem 0.5rem;
      border-radius: 6px;
      text-transform: uppercase;
    }

    .tag-direct { background: rgba(16, 185, 129, 0.18); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.35); }
    .tag-argo { background: rgba(99, 102, 241, 0.2); color: #a5b4fc; border: 1px solid rgba(99, 102, 241, 0.38); }
    .tag-clean { background: rgba(245, 158, 11, 0.18); color: #fcd34d; border: 1px solid rgba(245, 158, 11, 0.35); }
    .tag-0rtt { background: rgba(6, 182, 212, 0.16); color: #67e8f9; }

    .node-meta {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.77rem;
      color: var(--muted);
      background: rgba(0, 0, 0, 0.28);
      padding: 0.45rem 0.65rem;
      border-radius: 8px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .node-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .ping-badge {
      font-size: 0.76rem;
      font-weight: 650;
      color: var(--muted);
    }

    .ping-badge.fast { color: #34d399; }
    .ping-badge.mid { color: #fbbf24; }
    .ping-badge.fail { color: #fb7185; }

    .mini-btns {
      display: flex;
      gap: 0.4rem;
    }

    .mini-btn {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid var(--border);
      color: #e2e8f0;
      border-radius: 8px;
      padding: 0.32rem 0.65rem;
      font-size: 0.76rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }

    .mini-btn:hover {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    /* 二维码弹窗 */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 1rem;
    }

    .modal-backdrop.open { display: flex; }

    .modal {
      background: #111827;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 1.5rem;
      max-width: 360px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }

    .modal h3 { margin: 0 0 0.4rem; font-size: 1.05rem; }
    .modal p { margin: 0 0 1rem; font-size: 0.8rem; color: var(--muted); word-break: break-all; }
    .qr-box {
      background: #fff;
      padding: 1rem;
      border-radius: 12px;
      display: inline-block;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <main>
    <div class="hero">
      <div class="brand">
        <div class="brand-logo">⚡</div>
        <div>
          <h1>Unikraft Ultra · 极光节点中心</h1>
          <p>Web Crypto 本地零知识解密 · 3 账号 5 地区 6 节点矩阵管理</p>
        </div>
      </div>
      <div class="hero-badges">
        <span class="pill">🔒 AES-256-CBC 纯本地解密</span>
        <span class="pill">🚀 0-RTT (ed=2048) 加速</span>
        <span class="pill">🌏 SIN / SFO / FRA / WAS / DAL</span>
      </div>
    </div>

    <div id="statusBanner" class="status-banner" role="status"></div>

    <section class="glass-card">
      <div class="form-grid">
        <div>
          <label for="uuid">
            <span>🔑 解密密钥 (UUID)</span>
            <span style="font-size:0.76rem;color:var(--muted);">与 GitHub Secrets 一致</span>
          </label>
          <div class="input-wrap">
            <input id="uuid" type="password" placeholder="输入你的 UUID，例如 694949f5-54c3-..." autocomplete="off" spellcheck="false">
            <button type="button" id="toggleEye" class="eye-btn">显示</button>
          </div>
          <label class="remember-row">
            <input type="checkbox" id="rememberUuid" checked>
            <span>在此浏览器记住 UUID（下次打开链接自动秒解）</span>
          </label>
        </div>

        <div>
          <label for="payload">
            <span>📦 加密载荷 (Payload / 完整链接)</span>
            <span style="font-size:0.76rem;color:var(--muted);">支持 URL 自动提取</span>
          </label>
          <input id="payload" type="text" placeholder="粘贴 ?payload=... 链接或 IV:Base64 密文" spellcheck="false">
        </div>
      </div>

      <div class="toolbar">
        <button id="decryptBtn" type="button" class="btn">🔓 立即解密节点</button>
        <button id="copyAllBtn" type="button" class="btn btn-emerald" disabled>📋 复制全部 VLESS 链接</button>
        <button id="copyB64Btn" type="button" class="btn btn-cyan" disabled>📦 复制 Base64 通用订阅</button>
        <button id="downloadClashBtn" type="button" class="btn btn-ghost" disabled>⬇️ 下载 Clash (Mihomo) 配置</button>
        <button id="pingAllBtn" type="button" class="btn btn-ghost" disabled>⚡ 节点连通测速</button>
      </div>
    </section>

    <section id="dashboard" class="dashboard-section">
      <div class="stats-bar">
        <div class="stat-box">
          <div class="num" id="statTotal">0</div>
          <div class="lbl">总线路数 (含直连/Argo/优选)</div>
        </div>
        <div class="stat-box">
          <div class="num" id="statDirect">0</div>
          <div class="lbl">Unikraft 原生直连</div>
        </div>
        <div class="stat-box">
          <div class="num" id="statArgo">0</div>
          <div class="lbl">Argo 隧道 & 优选 IP</div>
        </div>
        <div class="stat-box">
          <div class="num" id="statRegions">0</div>
          <div class="lbl">覆盖地区 / 实例数</div>
        </div>
      </div>

      <div class="filter-tabs" id="filterTabs">
        <button class="tab-btn active" data-filter="all">全部线路</button>
        <button class="tab-btn" data-filter="direct">⚡ 仅看原生直连</button>
        <button class="tab-btn" data-filter="clean">🚀 仅看 CF 优选 IP</button>
        <button class="tab-btn" data-filter="SIN">🇸🇬 新加坡 (SIN)</button>
        <button class="tab-btn" data-filter="SFO">🇺🇸 旧金山 (SFO)</button>
        <button class="tab-btn" data-filter="FRA">🇩🇪 法兰克福 (FRA)</button>
        <button class="tab-btn" data-filter="WAS">🇺🇸 华盛顿 (WAS)</button>
        <button class="tab-btn" data-filter="DAL">🇺🇸 达拉斯 (DAL)</button>
      </div>

      <div id="nodesGrid" class="nodes-grid"></div>

      <div class="glass-card">
        <label for="resultRaw"><span>📄 原始明文订阅（可直接全选导入 v2rayN / Shadowrocket / NekoBox）</span></label>
        <textarea id="resultRaw" rows="6" readonly></textarea>
      </div>
    </section>
  </main>

  <!-- 二维码弹窗 -->
  <div id="qrModal" class="modal-backdrop">
    <div class="modal">
      <h3 id="qrTitle">扫码导入节点</h3>
      <p id="qrSub"></p>
      <div id="qrContainer" class="qr-box"></div>
      <div>
        <button type="button" id="closeModalBtn" class="btn btn-ghost" style="width:100%;justify-content:center;">关闭窗口</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "ukc_ultra_uuid";
    const uuidEl = document.getElementById("uuid");
    const rememberEl = document.getElementById("rememberUuid");
    const toggleEyeBtn = document.getElementById("toggleEye");
    const payloadEl = document.getElementById("payload");
    const decryptBtn = document.getElementById("decryptBtn");
    const copyAllBtn = document.getElementById("copyAllBtn");
    const copyB64Btn = document.getElementById("copyB64Btn");
    const downloadClashBtn = document.getElementById("downloadClashBtn");
    const pingAllBtn = document.getElementById("pingAllBtn");
    const statusBanner = document.getElementById("statusBanner");
    const dashboardEl = document.getElementById("dashboard");
    const nodesGridEl = document.getElementById("nodesGrid");
    const resultRawEl = document.getElementById("resultRaw");
    const qrModal = document.getElementById("qrModal");
    const qrTitle = document.getElementById("qrTitle");
    const qrSub = document.getElementById("qrSub");
    const qrContainer = document.getElementById("qrContainer");

    let parsedNodes = [];
    let currentFilter = "all";

    function showStatus(msg, type = "ok") {
      if (!msg) {
        statusBanner.className = "status-banner";
        statusBanner.textContent = "";
        return;
      }
      statusBanner.textContent = msg;
      statusBanner.className = `status-banner show ${type}`;
    }

    toggleEyeBtn.addEventListener("click", () => {
      const isPwd = uuidEl.type === "password";
      uuidEl.type = isPwd ? "text" : "password";
      toggleEyeBtn.textContent = isPwd ? "隐藏" : "显示";
    });

    function extractPayload(input) {
      const raw = input.trim();
      if (!raw) return "";
      try {
        const parsed = new URL(raw);
        const fromQuery = parsed.searchParams.get("payload");
        if (fromQuery) return fromQuery.trim();
      } catch (_) {}
      const idx = raw.indexOf("payload=");
      if (idx !== -1) {
        const candidate = raw.slice(idx + "payload=".length).split("&")[0];
        try { return decodeURIComponent(candidate.replace(/\+/g, "%20")).trim(); }
        catch (_) { return candidate.trim(); }
      }
      return raw;
    }

    function hexToBytes(hex) {
      const clean = hex.trim();
      if (clean.length % 2 !== 0 || !/^[0-9a-fA-F]+$/.test(clean)) {
        throw new Error("IV 不是有效的十六进制字符串。");
      }
      const out = new Uint8Array(clean.length / 2);
      for (let i = 0; i < clean.length; i += 2) {
        out[i / 2] = parseInt(clean.slice(i, i + 2), 16);
      }
      return out;
    }

    function base64ToBytes(b64) {
      const normalized = b64.trim().replace(/\s+/g, "").replace(/-/g, "+").replace(/_/g, "/");
      const binary = atob(normalized);
      const out = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) out[i] = binary.charCodeAt(i);
      return out;
    }

    async function deriveAesKey(uuid) {
      const encoded = new TextEncoder().encode(uuid);
      const digest = await crypto.subtle.digest("SHA-256", encoded);
      return crypto.subtle.importKey("raw", digest, { name: "AES-CBC" }, false, ["decrypt"]);
    }

    async function decryptPayload(uuid, payload) {
      const sep = payload.indexOf(":");
      if (sep <= 0) throw new Error("Payload 格式无效，应为 IV_HEX:BASE64_CIPHERTEXT");
      const ivHex = payload.slice(0, sep).trim();
      const ciphertextB64 = payload.slice(sep + 1).trim();
      const key = await deriveAesKey(uuid);
      const iv = hexToBytes(ivHex);
      const ciphertext = base64ToBytes(ciphertextB64);
      const plaintext = await crypto.subtle.decrypt({ name: "AES-CBC", iv }, key, ciphertext);
      return new TextDecoder().decode(plaintext);
    }

    function detectRegionInfo(name, host) {
      const text = `${name} ${host}`.toUpperCase();
      if (text.includes("SIN") || text.includes(".SIN.")) return { code: "SIN", flag: "🇸🇬", label: "新加坡" };
      if (text.includes("SFO") || text.includes(".SFO.")) return { code: "SFO", flag: "🇺🇸", label: "旧金山" };
      if (text.includes("FRA") || text.includes(".FRA.")) return { code: "FRA", flag: "🇩🇪", label: "法兰克福" };
      if (text.includes("WAS") || text.includes(".WAS.")) return { code: "WAS", flag: "🇺🇸", label: "华盛顿" };
      if (text.includes("DAL") || text.includes(".DAL.")) return { code: "DAL", flag: "🇺🇸", label: "达拉斯" };
      return { code: "OTHER", flag: "🌐", label: "全球节点" };
    }

    function parseVlessLine(line, idx) {
      try {
        const u = new URL(line);
        const rawName = decodeURIComponent(u.hash ? u.hash.slice(1) : `Node-${idx + 1}`);
        const server = u.hostname;
        const port = Number(u.port || 443);
        const uuid = u.username;
        const sni = u.searchParams.get("sni") || server;
        const wsHost = u.searchParams.get("host") || sni;
        const wsPath = decodeURIComponent(u.searchParams.get("path") || "/");
        const region = detectRegionInfo(rawName, wsHost);

        let channel = "direct";
        let channelLabel = "原生直连";
        if (rawName.toLowerCase().includes("cleanip") || rawName.toLowerCase().includes("visasg") || (server !== wsHost)) {
          channel = "clean";
          channelLabel = "CF 优选 IP";
        } else if (rawName.toLowerCase().includes("argo") || !wsHost.endsWith("unikraft.app")) {
          channel = "argo";
          channelLabel = "Argo 隧道";
        }

        const has0Rtt = wsPath.includes("ed=2048");
        return {
          id: idx,
          raw: line,
          name: `${region.flag} ${rawName}`,
          cleanName: rawName,
          server,
          port,
          uuid,
          sni,
          wsHost,
          wsPath,
          region,
          channel,
          channelLabel,
          has0Rtt,
          latency: null
        };
      } catch (_) {
        return null;
      }
    }

    function renderNodes() {
      nodesGridEl.innerHTML = "";
      const filtered = parsedNodes.filter(n => {
        if (currentFilter === "all") return true;
        if (currentFilter === "direct") return n.channel === "direct";
        if (currentFilter === "clean") return n.channel === "clean" || n.channel === "argo";
        return n.region.code === currentFilter;
      });

      filtered.forEach(node => {
        const card = document.createElement("div");
        card.className = "node-card";

        const tagClass = node.channel === "direct" ? "tag-direct" : (node.channel === "clean" ? "tag-clean" : "tag-argo");
        let pingHtml = `<span class="ping-badge" id="ping-${node.id}">待测速</span>`;
        if (node.latency === "fail") pingHtml = `<span class="ping-badge fail" id="ping-${node.id}">超时</span>`;
        else if (typeof node.latency === "number") {
          const cls = node.latency < 220 ? "fast" : "mid";
          pingHtml = `<span class="ping-badge ${cls}" id="ping-${node.id}">${node.latency} ms</span>`;
        }

        card.innerHTML = `
          <div>
            <div class="node-head">
              <div class="node-title">${node.name}</div>
              <div class="badges">
                <span class="tag ${tagClass}">${node.channelLabel}</span>
                ${node.has0Rtt ? '<span class="tag tag-0rtt">0-RTT</span>' : ''}
              </div>
            </div>
            <div class="node-meta" title="${node.server}:${node.port} (SNI: ${node.sni})" style="margin-top:0.55rem;">
              ${node.server}:${node.port} · SNI: ${node.sni}
            </div>
          </div>
          <div class="node-foot">
            ${pingHtml}
            <div class="mini-btns">
              <button type="button" class="mini-btn" data-qr="${node.id}">二维码</button>
              <button type="button" class="mini-btn" data-copy="${node.id}">复制节点</button>
            </div>
          </div>
        `;
        nodesGridEl.appendChild(card);
      });

      nodesGridEl.querySelectorAll("[data-copy]").forEach(btn => {
        btn.addEventListener("click", async () => {
          const node = parsedNodes.find(n => n.id === Number(btn.dataset.copy));
          if (!node) return;
          await navigator.clipboard.writeText(node.raw);
          showStatus(`✅ 已复制节点：${node.name}`, "ok");
        });
      });

      nodesGridEl.querySelectorAll("[data-qr]").forEach(btn => {
        btn.addEventListener("click", () => {
          const node = parsedNodes.find(n => n.id === Number(btn.dataset.qr));
          if (!node) return;
          openQrModal(node.name, `${node.server}:${node.port}`, node.raw);
        });
      });
    }

    function openQrModal(title, sub, text) {
      qrTitle.textContent = title;
      qrSub.textContent = sub;
      qrContainer.innerHTML = "";
      if (typeof qrcode === "function") {
        const qr = qrcode(0, "M");
        qr.addData(text);
        qr.make();
        qrContainer.innerHTML = qr.createSvgTag(4, 0);
      } else {
        qrContainer.textContent = "二维码组件加载中...";
      }
      qrModal.classList.add("open");
    }

    document.getElementById("closeModalBtn").addEventListener("click", () => qrModal.classList.remove("open"));
    qrModal.addEventListener("click", (e) => { if (e.target === qrModal) qrModal.classList.remove("open"); });

    document.getElementById("filterTabs").addEventListener("click", (e) => {
      const btn = e.target.closest(".tab-btn");
      if (!btn) return;
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentFilter = btn.dataset.filter;
      renderNodes();
    });

    async function handleDecrypt() {
      const uuid = uuidEl.value.trim();
      const payload = extractPayload(payloadEl.value);
      if (!payload) return showStatus("请先粘贴加密 Payload 链接！", "err");
      if (!uuid) return showStatus("请输入你的 UUID 解密密钥！", "err");

      try {
        const text = (await decryptPayload(uuid, payload)).trim();
        if (rememberEl.checked) localStorage.setItem(STORAGE_KEY, uuid);
        else localStorage.removeItem(STORAGE_KEY);

        resultRawEl.value = text;
        const lines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l.startsWith("vless://"));
        parsedNodes = lines.map((l, i) => parseVlessLine(l, i)).filter(Boolean);

        document.getElementById("statTotal").textContent = parsedNodes.length;
        document.getElementById("statDirect").textContent = parsedNodes.filter(n => n.channel === "direct").length;
        document.getElementById("statArgo").textContent = parsedNodes.filter(n => n.channel !== "direct").length;
        const uniqueHosts = new Set(parsedNodes.filter(n => n.channel === "direct").map(n => n.server));
        document.getElementById("statRegions").textContent = uniqueHosts.size || new Set(parsedNodes.map(n => n.region.code)).size;

        dashboardEl.classList.add("active");
        copyAllBtn.disabled = false;
        copyB64Btn.disabled = false;
        downloadClashBtn.disabled = false;
        pingAllBtn.disabled = false;

        renderNodes();
        showStatus(`🎉 解密成功！共解析出 ${parsedNodes.length} 条高速节点线路。`, "ok");
      } catch (err) {
        console.error(err);
        showStatus("❌ 解密失败：请检查 UUID 是否正确，或加密链接是否完整。", "err");
      }
    }

    decryptBtn.addEventListener("click", handleDecrypt);

    copyAllBtn.addEventListener("click", async () => {
      await navigator.clipboard.writeText(resultRawEl.value);
      showStatus("✅ 已复制全部 VLESS 链接到剪贴板！可直接粘贴到 v2rayN / Shadowrocket。", "ok");
    });

    copyB64Btn.addEventListener("click", async () => {
      const b64 = btoa(unescape(encodeURIComponent(resultRawEl.value)));
      await navigator.clipboard.writeText(b64);
      showStatus("✅ 已复制 Base64 编码订阅内容到剪贴板！", "ok");
    });

    downloadClashBtn.addEventListener("click", () => {
      if (!parsedNodes.length) return;
      const proxyLines = [];
      const proxyNames = [];

      parsedNodes.forEach((n, idx) => {
        const pName = `${n.name}-${idx + 1}`;
        proxyNames.push(`      - "${pName}"`);
        proxyLines.push(`  - name: "${pName}"
    type: vless
    server: ${n.server}
    port: ${n.port}
    uuid: ${n.uuid}
    tls: true
    udp: true
    servername: ${n.sni}
    client-fingerprint: chrome
    network: ws
    ws-opts:
      path: "${n.wsPath}"
      headers:
        Host: ${n.wsHost}`);
      });

      const yaml = `mixed-port: 7890
allow-lan: true
mode: rule
log-level: info
ipv6: false
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
  fallback:
    - 1.1.1.1
    - 8.8.8.8

proxies:
${proxyLines.join("\n")}

proxy-groups:
  - name: "🚀 节点选择"
    type: select
    proxies:
      - "⚡ 自动优选 (最低延迟)"
      - "🛡️ 故障转移"
${proxyNames.join("\n")}
  - name: "⚡ 自动优选 (最低延迟)"
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 180
    tolerance: 50
    proxies:
${proxyNames.join("\n")}
  - name: "🛡️ 故障转移"
    type: fallback
    url: http://www.gstatic.com/generate_204
    interval: 180
    proxies:
${proxyNames.join("\n")}

rules:
  - GEOIP,LAN,DIRECT,no-resolve
  - GEOIP,CN,DIRECT
  - MATCH,🚀 节点选择
`;
      const blob = new Blob([yaml], { type: "text/yaml;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "unikraft-ultra-clash.yaml";
      a.click();
      URL.revokeObjectURL(url);
      showStatus("✅ 已生成并下载 Clash (Mihomo) 配置文件！", "ok");
    });

    pingAllBtn.addEventListener("click", async () => {
      showStatus("⚡ 正在浏览器端并发测速所有节点 HTTP 握手延迟...", "ok");
      await Promise.all(parsedNodes.map(async (node) => {
        const start = performance.now();
        try {
          const ctrl = new AbortController();
          const timer = setTimeout(() => ctrl.abort(), 3500);
          await fetch(`https://${node.server}:${node.port}/`, { mode: "no-cors", cache: "no-store", signal: ctrl.signal });
          clearTimeout(timer);
          node.latency = Math.round(performance.now() - start);
        } catch (_) {
          node.latency = "fail";
        }
        renderNodes();
      }));
      showStatus("✅ 节点连通性测速完成！", "ok");
    });

    // 初始化：读取 URL payload 与本地保存的 UUID，若两者都有则自动秒解
    (function init() {
      const params = new URLSearchParams(window.location.search);
      const payload = params.get("payload");
      if (payload) payloadEl.value = payload;

      const savedUuid = localStorage.getItem(STORAGE_KEY);
      if (savedUuid) {
        uuidEl.value = savedUuid;
        if (payload) handleDecrypt();
      }
    })();
  </script>
</body>
</html>
